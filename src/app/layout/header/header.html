<header
  class="fixed top-0 left-0 right-0 h-16 bg-blue-900 text-white flex items-center justify-between px-6 z-50 shadow-md">

  <!-- Logo and Branding -->
  <div class="flex items-center gap-4">
    <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="white">
      <path
        d="M718-313 604-426l57-56 57 56 141-141 57 56-198 198ZM440-501Zm0 381L313-234q-72-65-123.5-116t-85-96q-33.5-45-49-87T40-621q0-94 63-156.5T260-840q52 0 99 22t81 62q34-40 81-62t99-22q81 0 136 45.5T831-680h-85q-18-40-53-60t-73-20q-51 0-88 27.5T463-660h-46q-31-45-70.5-72.5T260-760q-57 0-98.5 39.5T120-621q0 33 14 67t50 78.5q36 44.5 98 104T440-228q26-23 61-53t56-50l9 9 19.5 19.5L605-283l9 9q-22 20-56 49.5T498-172l-58 52Z" />
    </svg>
    <h1 class="text-2xl font-bold tracking-wide text-white">CareNexus</h1>
  </div>

  <!-- Right Actions & Notifications -->
  <div class="flex items-center gap-6 relative">

    <!-- Notification Bell Icon with Badge -->
    <div class="relative">
      <button (click)="toggleNotificationDropdown()"
        class="relative p-2 rounded-full hover:bg-blue-800 transition-colors focus:outline-none" title="Notifications">
        <!-- Bell Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 fill-current text-white" viewBox="0 0 24 24">
          <path
            d="M12 22a2.98 2.98 0 0 0 2.818-2H9.182A2.98 2.98 0 0 0 12 22zm7-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C8.64 5.36 7 7.92 7 11v5l-2 2v1h14v-1l-2-2z" />
        </svg>

        <!-- Unread Badge Counter -->
        <span *ngIf="unreadCount > 0"
          class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full animate-pulse border border-white">
          {{ unreadCount > 99 ? '99+' : unreadCount }}
        </span>
      </button>

      <!-- Header Notification Dropdown Box -->
      <div *ngIf="isNotificationDropdownOpen"
        class="absolute right-0 mt-3 w-96 bg-white text-gray-800 rounded-xl shadow-2xl border border-gray-100 z-50 overflow-hidden text-sm animate-fade-in">

        <!-- Header Title -->
        <div class="px-4 py-3 bg-blue-900 text-white flex justify-between items-center border-b">
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current" viewBox="0 0 24 24">
              <path
                d="M12 22a2.98 2.98 0 0 0 2.818-2H9.182A2.98 2.98 0 0 0 12 22zm7-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C8.64 5.36 7 7.92 7 11v5l-2 2v1h14v-1l-2-2z" />
            </svg>
            <span class="font-bold text-base">Notifications</span>
          </div>
          <span class="text-xs bg-blue-700 px-2 py-0.5 rounded-full font-medium text-blue-100">
            {{ unreadCount }} Unread
          </span>
        </div>

        <!-- Notification List -->
        <div class="max-h-80 overflow-y-auto divide-y divide-gray-100">
          <div *ngIf="isLoading" class="p-6 text-center text-gray-500">
            Loading notifications...
          </div>

          <div *ngIf="!isLoading && notifications.length === 0" class="p-6 text-center text-gray-400">
            No notifications available.
          </div>

          <div *ngFor="let n of notifications" class="p-3 hover:bg-gray-50 transition-colors flex flex-col gap-2"
            [ngClass]="{'bg-blue-50/50': n.status === 'Unread', 'opacity-60': n.status === 'Dismissed'}">

            <div class="flex justify-between items-start">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full text-blue-800 bg-blue-100 uppercase">
                {{ n.category || 'System' }}
              </span>
              <span class="text-xs text-gray-400">
                {{ n.createdDate | date:'shortTime' }}
              </span>
            </div>

            <p class="text-xs text-gray-700 font-medium leading-snug">
              {{ n.message }}
            </p>

            <div class="flex items-center justify-between pt-1 border-t border-gray-50">
              <span class="text-xs font-semibold text-gray-400">
                Status: <span
                  [ngClass]="{'text-blue-600': n.status === 'Unread', 'text-green-600': n.status === 'Read', 'text-gray-500': n.status === 'Dismissed'}">{{
                  n.status }}</span>
              </span>

              <!-- Quick Dropdown Actions (Read / Dismiss / Delete) -->
              <div class="flex items-center gap-1">
                <button *ngIf="n.status === 'Unread'" (click)="markAsRead(n.notificationId, $event)"
                  class="px-2 py-0.5 text-xs bg-green-600 hover:bg-green-700 text-white rounded font-medium transition-colors"
                  title="Mark as Read">
                  Read
                </button>
                <button *ngIf="n.status !== 'Dismissed'" (click)="dismissNotification(n.notificationId, $event)"
                  class="px-2 py-0.5 text-xs bg-amber-500 hover:bg-amber-600 text-white rounded font-medium transition-colors"
                  title="Dismiss Notification">
                  Dismiss
                </button>
                <button (click)="deleteNotification(n.notificationId, $event)"
                  class="px-2 py-0.5 text-xs bg-red-600 hover:bg-red-700 text-white rounded font-medium transition-colors"
                  title="Delete Notification">
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- User Profile & Logout -->
    <div class="flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="white">
        <path
          d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm146.5-204.5Q340-521 340-580t40.5-99.5Q421-720 480-720t99.5 40.5Q620-639 620-580t-40.5 99.5Q539-440 480-440t-99.5-40.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm100-95.5q47-15.5 86-44.5-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160q53 0 100-15.5ZM523-537q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-43-43Zm0 360Z" />
      </svg>
      <span class="text-sm font-medium text-white hidden md:inline">
        Welcome, {{ authService.getUserName() }}
      </span>
      <button (click)="logout()"
        class="border border-white/30 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-white/10 transition-colors">
        Logout
      </button>
    </div>

  </div>

</header>
