<header
  class="fixed top-0 left-0 right-0 h-16 bg-[#0b666a] text-white border-b flex items-center justify-between px-6 z-50">

  <div>

    <h1
      class="text-2xl font-semibold text-white">

      CareNexus

    </h1>

  </div>

  <div
    class="flex items-center gap-4">

    <span
      class="text-white">

      Welcome,
      {{ authService.getUserName() }}

    </span>

    <button
      (click)="logout()"
      class="border px-4 py-2 rounded-lg hover:bg-gray-50">

      Logout

    </button>

  </div>

</header>
