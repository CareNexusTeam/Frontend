<aside class="sidebar-container" [class.collapsed]="collapsed">
  
  <aside class="relative border-r border-gray-200 bg-white">
  <!-- Absolute floating badge button centered on the right border line -->
  <button 
    (click)="toggleSidebar()" 
    type="button"
    class="toggle-badge absolute right-0 top-6 translate-x-1/2 z-50 flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 hover:text-gray-900 focus:outline-none transition-transform active:scale-95"
    [title]="collapsed ? 'Expand Sidebar' : 'Collapse Sidebar'">
    
    <svg 
      class="h-4 w-4 transition-transform duration-300" 
      [class.rotate-180]="collapsed" 
      fill="none" 
      viewBox="0 0 24 24" 
      stroke="currentColor" 
      stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
  </button>

  <nav class="p-3">
    <!-- Menu items here -->
  </nav>
</aside>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    @for(menu of menus; track menu.route) {
    <a [routerLink]="menu.route" 
       routerLinkActive="active"
       class="nav-item"
       [title]="collapsed ? menu.name : ''">

      <!-- Dynamic Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" 
           class="nav-icon" 
           fill="none"
           viewBox="0 0 24 24" 
           stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="menu.iconSvg" />
      </svg>

      <!-- Using Angular's @if control flow removes the need for NgIf import -->
      @if (!collapsed) {
        <span class="nav-label">{{ menu.name }}</span>
      }
    </a>
    }
  </nav>
  

</aside>
