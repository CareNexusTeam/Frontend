<aside
  class="fixed left-0 top-0 h-screen w-64 bg-white border-r flex flex-col justify-between"
>
  <div>
    <div class="p-6 border-b">
      <h1 class="text-3xl font-semibold text-teal-600">
        CareNexus
      </h1>

      <p class="text-sm text-gray-500">
        Healthcare Portal
      </p>
    </div>

    <nav class="p-4 flex flex-col gap-2">
      @for(menu of menus; track menu.route){

      <a
        [routerLink]="menu.route"
        routerLinkActive="bg-teal-50 text-teal-600"
        class="px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition"
      >
        {{ menu.name }}
      </a>

      }
    </nav>
  </div>

  <div class="p-4 border-t">
    <button
      class="w-full border border-teal-500 text-teal-600 rounded-xl py-3 hover:bg-teal-50"
    >
      Logout
    </button>
  </div>
</aside>
