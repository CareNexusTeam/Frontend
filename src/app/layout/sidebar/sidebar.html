<aside
  [class.w-64]="!collapsed"
  [class.w-20]="collapsed"
  class="fixed left-0 top-16 h-[calc(100vh-4rem)] bg-white border-r transition-all duration-300 flex flex-col justify-between z-40">

  <div>

    <!-- Logo Section -->

    <!-- Menu Section -->

    <nav class="p-3 flex flex-col gap-2">

      @for(menu of menus; track menu.route){

      <a
        [routerLink]="menu.route"
        routerLinkActive="bg-teal-50 text-teal-600"
        class="rounded-lg px-4 py-3 hover:bg-gray-100 transition">

        @if(!collapsed){

        {{ menu.name }}

        }

      </a>

      }

    </nav>

  </div>

</aside>
