<aside
  class="fixed top-16 left-0 w-64 h-[calc(100vh-4rem)] bg-gradient-to-br from-[#EAE5C9] to-[#6CC6CB]

  border-r z-40">

  <nav class="p-4 flex flex-col gap-2">

    @for(menu of menus; track menu.route) {

    <a
      [routerLink]="menu.route"
      routerLinkActive="bg-teal-50 text-teal-600"
      class="px-4 py-3 rounded-lg hover:bg-gray-100">

      {{ menu.name }}

    </a>

    }

  </nav>

</aside>
