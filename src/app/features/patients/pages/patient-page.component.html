<app-main-layout>

<div class="patient-page-container">
  <!-- Top Header -->
  <header class="page-header">

    <div class="flex">
    <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#00008b"><path d="M480-560q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm0-80q33 0 56.5-23.5T560-720q0-33-23.5-56.5T480-800q-33 0-56.5 23.5T400-720q0 33 23.5 56.5T480-640ZM160-80v-271q0-34 17-62.5t47-44.5q51-26 115.5-44T480-520q76 0 140.5 18T736-458q30 16 47 44.5t17 62.5v191q0 33-23.5 56.5T720-80H390q-46 0-78-32t-32-78q0-46 32-78t78-32h113l62-132q-20-4-41-6t-44-2q-72 0-128 17.5T261-386q-10 5-15.5 14.5T240-351v271h-80Zm230-80h48l28-60h-76q-12 0-21 9t-9 21q0 12 9 21t21 9Zm136 0h194v-191q0-11-5.5-20.5T700-386q-12-6-26-12.5T644-411L526-160Zm-46-560Zm0 426Z"/></svg>
    <h2> Patients</h2>
   </div>

    <p>Register and manage patient records</p>
  </header>

  <!-- Register Patient Form Card -->
  <section class="card form-card">
    <h3 class="card-title">Register Patient</h3>

    <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        
        <div class="form-group">
          <label>Name</label>
          <input type="text" formControlName="name" />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" formControlName="dob" />
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select formControlName="gender">
            <option value="" disabled selected>Select Gender</option>
            <option *ngFor="let g of genderOptions" [value]="g">{{ g }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Blood Group</label>
          <select formControlName="bloodGroup">
            <option value="" disabled selected>Select Blood Group</option>
            <option *ngFor="let bg of bloodGroupOptions" [value]="bg">{{ bg }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" formControlName="phone" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" />
        </div>

        <div class="form-group full-width">
          <label>Address</label>
          <textarea formControlName="address" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>Emergency Contact</label>
          <input type="text" formControlName="emergencyContact" />
        </div>

        <div class="form-group">
          <label>Insurance Provider ID</label>
          <input type="text" formControlName="insuranceProviderId" />
        </div>

        <div class="form-group">
          <label>Status</label>
          <select formControlName="status">
            <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
          </select>
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="patientForm.invalid || isLoading">
          {{ isLoading ? 'Registering...' : 'Register Patient' }}
        </button>
      </div>
    </form>
  </section>

  <!-- All Patients Table Card (Hidden for 'Patient' role) -->
  <section class="card table-card" *ngIf="userRole !== 'Patient'">
    <div class="table-header">
      <h3>All Patients</h3>
      <button class="btn-refresh" (click)="fetchPatients()" [disabled]="isLoading">
        {{ isLoading ? 'Loading...' : 'Refresh' }}
      </button>
    </div>

    <!-- Error Banner -->
    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <div class="table-responsive">
      <table class="patients-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>GENDER</th>
            <th>PHONE</th>
            <th>EMAIL</th>
            <th>STATUS</th>
            <th>ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of patientsList">
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.gender }}</td>
            <td>{{ p.phone }}</td>
            <td>{{ p.email }}</td>
            <td><span class="status-badge">{{ p.status }}</span></td>
            <td>
              <button class="action-btn">View</button>
            </td>
          </tr>

          <tr *ngIf="patientsList.length === 0 && !isLoading">
            <td colspan="7" class="no-records">No patients yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
</app-main-layout>
