<app-main-layout>

  <app-emr-tabs></app-emr-tabs>
  <div class="w-full">

    
    <!-- Create Referral -->
    <div class="bg-white border rounded-2xl p-6 mb-8">

      <h2 class="text-3xl font-medium mb-6">
        Create Referral
      </h2>

      <form
        [formGroup]="referralForm"
        (ngSubmit)="saveReferral()"
        class="space-y-5">

        <div class="grid md:grid-cols-2 gap-5">

          <div>

            <label class="block mb-2 text-sm">
              Consultation ID
            </label>

            <input
              formControlName="consultationId"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Referred To Department
            </label>

            <input
              formControlName="referredDepartment"
              class="w-full border rounded-lg px-4 py-3">

          </div>

        </div>

        <div>

          <label class="block mb-2 text-sm">
            Reason
          </label>

          <textarea
            rows="4"
            formControlName="reason"
            class="w-full border rounded-lg px-4 py-3">
          </textarea>

        </div>

        <div class="grid md:grid-cols-2 gap-5">

          <div>

            <label class="block mb-2 text-sm">
              Priority
            </label>

            <select
              formControlName="priority"
              class="w-full border rounded-lg px-4 py-3">

              <option>Routine</option>
              <option>Urgent</option>
              <option>Emergency</option>

            </select>

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Status
            </label>

            <input
              formControlName="status"
              class="w-full border rounded-lg px-4 py-3">

          </div>

        </div>

        <button
          type="submit"
          class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-lg">

          Save Referral

        </button>

      </form>

    </div>

    <!-- Referrals Table -->

    <div class="bg-white border rounded-2xl p-6">

      <h2 class="text-2xl font-medium mb-5">
        All Referrals
      </h2>

      <div class="overflow-x-auto">

        <table class="w-full">

          <thead>

          <tr class="bg-gray-50 text-sm text-gray-600">

            <th class="text-left p-3">
              ID
            </th>

            <th class="text-left p-3">
              CONSULTATION
            </th>

            <th class="text-left p-3">
              DEPARTMENT
            </th>

            <th class="text-left p-3">
              PRIORITY
            </th>

            <th class="text-left p-3">
              STATUS
            </th>

          </tr>

          </thead>


        </table>

      </div>

    </div>

  </div>

</app-main-layout>
