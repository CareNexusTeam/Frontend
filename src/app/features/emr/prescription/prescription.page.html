<app-main-layout>
  <app-emr-tabs></app-emr-tabs>

  <div class="w-full">

    <!-- Create Prescription -->

    <div class="bg-white border rounded-2xl p-6 mb-8">

      <h2 class="text-3xl font-medium mb-6">
        Create Prescription
      </h2>

      <form
        [formGroup]="prescriptionForm"
        (ngSubmit)="savePrescription()"
        class="space-y-5">

        <div class="grid md:grid-cols-2 gap-5">

          <div>

            <label class="block mb-2 text-sm">
              Consultation ID
            </label>

            <input
              formControlName="consultationId"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Patient ID
            </label>

            <input
              formControlName="patientId"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Medication Name
            </label>

            <input
              formControlName="medicationName"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Dosage
            </label>

            <input
              formControlName="dosage"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Frequency (per day)
            </label>

            <input
              formControlName="frequency"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Duration (days)
            </label>

            <input
              formControlName="durationDays"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label class="block mb-2 text-sm">
              Status
            </label>

            <select
              formControlName="status"
              class="w-full border rounded-lg px-4 py-3">

              <option>Issued</option>
              <option>Completed</option>

            </select>

          </div>

        </div>

        <button
          type="submit"
          class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-lg">

          Save Prescription

        </button>

      </form>

    </div>

    <!-- Prescriptions Table -->

    <div class="bg-white border rounded-2xl p-6">

      <h2 class="text-2xl font-medium mb-5">
        All Prescriptions
      </h2>

      <div class="overflow-x-auto">

        <table class="w-full">

          <thead>

          <tr class="bg-gray-50 text-sm text-gray-600">

            <th class="text-left p-3">
              ID
            </th>

            <th class="text-left p-3">
              MEDICATION
            </th>

            <th class="text-left p-3">
              DOSAGE
            </th>

            <th class="text-left p-3">
              FREQ
            </th>

            <th class="text-left p-3">
              DURATION
            </th>

            <th class="text-left p-3">
              STATUS
            </th>

          </tr>

          </thead>


        </table>

      </div>

    </div>

  </div>

</app-main-layout>
