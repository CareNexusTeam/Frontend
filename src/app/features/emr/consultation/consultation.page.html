<app-main-layout>

  <app-emr-tabs></app-emr-tabs>

  <div class="w-full">

    <div class="mb-8">

      <h1 class="text-4xl font-semibold text-gray-800">
        Consultation
      </h1>

      <p class="text-gray-500">
        Create and manage consultations
      </p>

    </div>

    <div class="bg-white rounded-2xl border p-6">

      <h2 class="text-2xl mb-6">
        Create Consultation
      </h2>

      <form
        [formGroup]="consultationForm"
        (ngSubmit)="saveConsultation()"
        class="space-y-5">

        <div
          class="grid md:grid-cols-2 gap-5">

          <div>

            <label
              class="block mb-2">

              Appointment ID

            </label>

            <input
              formControlName="appointmentId"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label
              class="block mb-2">

              Patient ID

            </label>

            <input
              formControlName="patientId"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label
              class="block mb-2">

              Doctor ID

            </label>

            <input
              formControlName="doctorId"
              class="w-full border rounded-lg px-4 py-3">

          </div>

          <div>

            <label
              class="block mb-2">

              Consultation Date

            </label>

            <input
              type="datetime-local"
              formControlName="consultationDate"
              class="w-full border rounded-lg px-4 py-3">

          </div>

        </div>

        <div>

          <label class="block mb-2">
            Symptoms
          </label>

          <input type="text"
            formControlName="symptoms"
            class="w-full border rounded-lg px-4 py-3">

            <label class="block mb-2">
            Diagnosis
          </label>

          <textarea
            formControlName="diagnosis"
            class="w-full border rounded-lg px-4 py-3">
          </textarea>

        </div>


        <div>

          <label class="block mb-2">
            Treatment Plan
          </label>

          <textarea
            rows="3"
            formControlName="treatmentPlan"
            class="w-full border rounded-lg px-4 py-3">
          </textarea>

        </div>

        <div>

          <label class="block mb-2">
            Status
          </label>

          <select
            formControlName="status"
            class="w-full border rounded-lg px-4 py-3">

            <option>
              InProgress
            </option>

            <option>
              Completed
            </option>

          </select>

        </div>

        <button
          type="submit"
          class="bg-teal-600 text-white px-6 py-3 rounded-lg">

          Save Consultation

        </button>

      </form>

    </div>

  </div>

</app-main-layout>
