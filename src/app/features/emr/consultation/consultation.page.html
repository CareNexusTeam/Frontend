<app-main-layout>

  <div class="min-h-screen bg-slate-50 p-6">

    <app-emr-tabs></app-emr-tabs>

    <!-- Create Consultation -->

    <div class="bg-white rounded-xl p-6 shadow-sm mb-6">

      <h2 class="text-lg font-semibold text-blue-900 mb-5">
        {{ isEditMode ? 'Update Consultation' : 'Create Consultation' }}
      </h2>

      <form
        [formGroup]="consultationForm"
        (ngSubmit)="saveConsultation()">

        <div class="grid md:grid-cols-2 gap-5">

          <div>
            <label class="block text-sm text-gray-600 mb-2">
              Appointment ID
            </label>

            <input
              type="number"
              formControlName="appointmentId"
              class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">
          </div>

          <div>
            <label class="block text-sm text-gray-600 mb-2">
              Patient ID
            </label>

            <input
              type="number"
              formControlName="patientId"
              class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">
          </div>

          <div>
            <label class="block text-sm text-gray-600 mb-2">
              Doctor ID
            </label>

            <input
              type="number"
              formControlName="doctorId"
              class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">
          </div>

          <div>
            <label class="block text-sm text-gray-600 mb-2">
              Consultation Date
            </label>

            <input
              type="datetime-local"
              formControlName="consultationDate"
              class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">
          </div>

        </div>

        <div class="mt-5">
          <label class="block text-sm text-gray-600 mb-2">
            Symptoms
          </label>

          <input
            type="text"
            formControlName="symptoms"
            class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">
        </div>

        <div class="mt-5">
          <label class="block text-sm text-gray-600 mb-2">
            Diagnosis
          </label>

          <textarea
            rows="3"
            formControlName="diagnosis"
            class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">
          </textarea>
        </div>

        <div class="mt-5">
          <label class="block text-sm text-gray-600 mb-2">
            Treatment Plan
          </label>

          <textarea
            rows="3"
            formControlName="treatmentPlan"
            class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">
          </textarea>
        </div>

        <div class="mt-5">
          <label class="block text-sm text-gray-600 mb-2">
            Status
          </label>

          <select
            formControlName="status"
            class="w-full bg-gray-50 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-900">

            <option value="InProgress">
              In Progress
            </option>

            <option value="Completed">
              Completed
            </option>

          </select>
        </div>

        <button
          type="submit"
          class="mt-5 bg-blue-900 text-white px-5 py-2.5 rounded-lg hover:bg-blue-800 transition">

          {{ isEditMode ? 'Update Consultation' : 'Save Consultation' }}

        </button>

      </form>

    </div>

    <!-- Consultation Records -->

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">

      <div class="bg-blue-900 px-6 py-4 text-white flex justify-between items-center">

        <h2 class="text-lg font-semibold">
          Consultation Records
        </h2>

        <div class="flex gap-3">

          <input
            [(ngModel)]="searchId"
            [ngModelOptions]="{standalone:true}"
            placeholder="Search Consultation ID"
            class="bg-white text-gray-700 rounded-lg px-4 py-2 w-64">

          <button
            type="button"
            (click)="searchConsultation()"
            class="bg-white text-blue-900 px-4 py-2 rounded-lg hover:bg-blue-50">

            Search

          </button>

          <button
            type="button"
            (click)="refreshConsultations()"
            class="bg-white text-blue-900 px-4 py-2 rounded-lg hover:bg-blue-50">

            Refresh

          </button>

        </div>

      </div>

      <div class="overflow-x-auto">

        <table class="w-full">

          <thead>

            <tr class="bg-gray-50">

              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">
                ID
              </th>

              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">
                Appointment ID
              </th>

              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">
                Patient ID
              </th>

              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">
                Doctor ID
              </th>

              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">
                Status
              </th>

              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">
                Actions
              </th>

            </tr>

          </thead>

          <tbody>

            <tr
              *ngFor="let consultation of consultations"
              class="border-t border-gray-100 hover:bg-gray-50 transition">

              <td class="px-4 py-4 text-sm text-gray-700">
                {{ consultation.consultationId }}
              </td>

              <td class="px-4 py-4 text-sm text-gray-700">
                {{ consultation.appointmentId }}
              </td>

              <td class="px-4 py-4 text-sm text-gray-700">
                {{ consultation.patientId }}
              </td>

              <td class="px-4 py-4 text-sm text-gray-700">
                {{ consultation.doctorId }}
              </td>

              <td class="px-4 py-4">

                <span
                  class="px-3 py-1 rounded-full text-xs font-medium"
                  [ngClass]="consultation.status === 'Completed'
                    ? 'bg-green-100 text-green-700'
                    : 'bg-yellow-100 text-yellow-700'">

                  {{ consultation.status }}

                </span>

              </td>

              <td class="px-4 py-4 flex gap-4">

                <button
                  type="button"
                  (click)="editConsultation(consultation)"
                  class="text-blue-900 text-sm hover:underline">

                  Edit

                </button>

                <button
                  type="button"
                  (click)="deleteConsultation(consultation.consultationId!)"
                  class="text-red-600 text-sm hover:underline">

                  Delete

                </button>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</app-main-layout>
