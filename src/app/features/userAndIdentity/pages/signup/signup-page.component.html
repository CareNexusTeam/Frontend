<div class="flex justify-center items-center min-h-screen bg-[#f4f6f8] font-sans antialiased p-5">
  <div class="bg-white rounded-lg p-8 w-full max-w-[440px] shadow-[0_4px_16px_rgba(0,0,0,0.08)]">
    <h2 class="m-0 mb-1.5 text-[#0b7a75] text-2xl font-bold">Create CareNexus Account</h2>
    <p class="text-slate-500 text-sm mb-5 mt-0">Join our healthcare management portal</p>

    <!-- Error Alert Box -->
    <div *ngIf="errorMessage" class="bg-red-50 text-red-600 border border-red-200 px-[14px] py-2.5 rounded-md text-xs mb-4">
      ⚠️ {{ errorMessage }}
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

      <!-- Name Field -->
      <div class="mb-4 flex flex-col">
        <label for="name" class="text-xs font-semibold text-slate-600 mb-1.5">Full Name</label>
        <input 
          id="name" 
          type="text" 
          formControlName="name" 
          placeholder="Enter your full name" 
          class="px-3 py-2.5 text-sm border border-slate-300 rounded-md outline-none transition-colors duration-200 focus:border-[#0b7a75]"
        />
        <span class="text-red-600 text-[11px] mt-1" *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.invalid">
          Name is required
        </span>
      </div>

      <!-- Email Field -->
      <div class="mb-4 flex flex-col">
        <label for="email" class="text-xs font-semibold text-slate-600 mb-1.5">Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="name@example.com" 
          class="px-3 py-2.5 text-sm border border-slate-300 rounded-md outline-none transition-colors duration-200 focus:border-[#0b7a75]"
        />
        <span class="text-red-600 text-[11px] mt-1" *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
          Valid email is required
        </span>
      </div>

      <!-- Password Field -->
      <div class="mb-4 flex flex-col">
        <label for="password" class="text-xs font-semibold text-slate-600 mb-1.5">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Create password" 
          class="px-3 py-2.5 text-sm border border-slate-300 rounded-md outline-none transition-colors duration-200 focus:border-[#0b7a75]"
        />
        <span class="text-red-600 text-[11px] mt-1" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          Password is required
        </span>
      </div>

      <!-- Phone Field -->
      <div class="mb-4 flex flex-col">
        <label for="phone" class="text-xs font-semibold text-slate-600 mb-1.5">Phone Number</label>
        <input 
          id="phone" 
          type="text" 
          formControlName="phone" 
          placeholder="10-digit phone number" 
          class="px-3 py-2.5 text-sm border border-slate-300 rounded-md outline-none transition-colors duration-200 focus:border-[#0b7a75]"
        />
        <span class="text-red-600 text-[11px] mt-1" *ngIf="signupForm.get('phone')?.touched && signupForm.get('phone')?.invalid">
          Enter a valid 10-digit phone number
        </span>
      </div>

      <!-- Role Selection Field -->
      <div class="mb-4 flex flex-col">
        <label for="role" class="text-xs font-semibold text-slate-600 mb-1.5">Register As</label>
        <select id="role" formControlName="role" class="px-3 py-2.5 text-sm border border-slate-300 rounded-md outline-none transition-colors duration-200 focus:border-[#0b7a75] bg-white">
          <option value="Patient">Patient</option>
          <option value="Doctor">Doctor</option>
          <option value="Nurse">Nurse</option>
          <option value="Admin">Admin</option>
          <option value="Pharmacist">Pharmacist</option>
          <option value="Billing">Billing Officer</option>
          <option value="Compliance">Compliance / Auditor</option>
        </select>
      </div>

      <button 
        type="submit" 
        [disabled]="signupForm.invalid || isLoading" 
        class="w-full p-3 bg-[#0b7a75] hover:bg-[#085f5b] disabled:bg-slate-300 disabled:cursor-not-allowed text-white border-none rounded-md text-3 font-semibold cursor-pointer mt-2 transition-colors duration-200"
      >
        {{ isLoading ? 'Registering...' : 'Sign Up' }}
      </button>
    </form>

    <div class="text-center mt-5 text-xs text-slate-500">
      Already have an account? <a routerLink="/login" class="text-[#0b7a75] no-underline font-semibold hover:underline">Login here</a>
    </div>
  </div>
</div>
