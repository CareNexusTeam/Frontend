<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="brand-title">CareNexus</h1>
    <p class="brand-subtitle">Sign in to your account</p>

    <!-- Error Message Alert Box -->
    <div *ngIf="errorMessage" class="error-alert">
      ⚠️ {{ errorMessage }}
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="form-input" 
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-input" 
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/signup" class="auth-link">Sign up</a>
    </div>
  </div>
</div>
